
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d2c">
  <meta name="description" content="Ucapan ulang tahun spesial untuk Wulan yang ke-19.">
  <title>Selamat Ulang Tahun, Wulan! 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background dekorasi -->
  <div class="stars" aria-hidden="true"></div>
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>
  <div id="balloons" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="page">
    <header class="topline">
      ✦ Wulan Sri Anggun Purba ✦
    </header>

    <section class="hero">

      <h1>
        Selamat Ulang Tahun,<br>
        <span class="name">Wulan</span>
        <span class="twinkle">✨</span>
      </h1>

      <p class="subtitle">
        Selamat ulang tahun wulan, sehat selalu dan panjang umur
      </p>

      <!-- FOTO WULAN -->
      <div class="photo-card">
        <div class="photo-frame">
          <img
            id="wulanPhoto"
            src="images/wulan.jpeg"
            alt="Foto Wulan"
          >

          <div class="photo-placeholder" id="photoPlaceholder">
            <span class="photo-icon">♡</span>
            <strong>Foto Wulan</strong>
            <small>Tambahkan foto favoritmu di sini</small>
          </div>
        </div>
      </div>

        <div
          class="cake"
          role="img"
          aria-label="Kue ulang tahun dengan lilin angka 19"
        >
          <div class="candle candle-left">
            <span class="flame"></span>
            <span class="digit">1</span>
          </div>

          <div class="candle candle-right">
            <span class="flame"></span>
            <span class="digit">9</span>
          </div>

          <div class="icing">
            <span class="drip d1"></span>
            <span class="drip d2"></span>
            <span class="drip d3"></span>
            <span class="drip d4"></span>
          </div>

          <div class="cake-top"></div>

          <div class="cake-body">
            <span class="cake-heart">♥</span>
            <span class="cake-heart">✦</span>
            <span class="cake-heart">♥</span>
          </div>

          <div class="cake-base"></div>
        </div>

        <p class="age-note">19 tahun sekarang di bulan 10, tanggal 20 dan 2026 ♡</p>
      </div>

  <script src="script.js"></script>
</body>
</html>
